spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/divvi}
    username: ${DATABASE_USERNAME:divvi}
    password: ${DATABASE_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}

  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:divvi-receipts-joey}
      region: ${AWS_REGION:us-east-1}